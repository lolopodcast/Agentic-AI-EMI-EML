<style>
  :root {
    --bcg-green: #004030;
    --bcg-gold: #D8C3A5;
    --bcg-cream: #F5EFE6;
    --bcg-ivory: #FAF6EF;
    --ink: #1a1a1a;
    --mute: #6b6b6b;
    --line: #E3D9C5;
    --ok: #2f7d4f;
    --bad: #b3261e;
  }
  html, body { background: #f4f4f4; color: var(--ink); font-family: 'Inter', sans-serif; }
  .dark body { background: #121212; color: #e5e5e5; }
  .dark { --ink: #ecead8; --mute: #9aa9a3; --line: #2a3d35; --bcg-cream: #1a2520; --bcg-ivory: #14201c; }

  body { selection: bg-[#004030] text-white; }
  ::selection { background: #004030; color: #fff; }
  .dark ::selection { background: #D8C3A5; color: #004030; }

  /* Card */
  .bcg-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; }
  .dark .bcg-card { background: #1a2520; border-color: #2a3d35; }
  .bcg-card-cream { background: var(--bcg-cream); border: 1px solid var(--line); border-radius: 14px; }

  /* Buttons */
  .bcg-btn { background: var(--bcg-green); color: #fff; border-radius: 10px; padding: 10px 20px; font-weight: 500; transition: all .15s ease; font-family: 'Inter', sans-serif; }
  .bcg-btn:hover { background: #00604a; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,64,48,.18); }
  .bcg-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }
  .dark .bcg-btn { background: var(--bcg-gold); color: var(--bcg-green); }
  .dark .bcg-btn:hover { background: #E8D6B5; }

  .bcg-btn-ghost { background: transparent; color: var(--bcg-green); border: 1px solid var(--bcg-green); border-radius: 10px; padding: 10px 20px; font-weight: 500; transition: all .15s ease; }
  .bcg-btn-ghost:hover { background: rgba(0,64,48,.05); }
  .dark .bcg-btn-ghost { color: var(--bcg-gold); border-color: var(--bcg-gold); }
  .dark .bcg-btn-ghost:hover { background: rgba(216,195,165,.08); }

  /* Options */
  .opt { border: 1.5px solid var(--line); border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: all .15s; background: #fff; }
  .dark .opt { background: #14201c; }
  .opt:hover { border-color: var(--bcg-green); background: rgba(0,64,48,.04); }
  .dark .opt:hover { border-color: var(--bcg-gold); background: rgba(216,195,165,.06); }
  .opt.selected { border-color: var(--bcg-green); background: rgba(0,64,48,.08); }
  .dark .opt.selected { border-color: var(--bcg-gold); background: rgba(216,195,165,.10); }
  .opt.correct { border-color: var(--ok); background: rgba(47,125,79,.10); }
  .opt.wrong { border-color: var(--bad); background: rgba(179,38,30,.08); }

  /* Topic tile */
  .topic-tile { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px; cursor: pointer; transition: all .25s ease; position: relative; overflow: hidden; }
  .dark .topic-tile { background: #1a2520; border-color: #2a3d35; }
  .topic-tile:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,64,48,.10); border-color: var(--bcg-green); }
  .dark .topic-tile:hover { border-color: var(--bcg-gold); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .topic-tile::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--bcg-green); }
  .dark .topic-tile::before { background: var(--bcg-gold); }

  /* Badge */
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 600; letter-spacing: .5px; font-family: 'Inter', sans-serif; }
  .badge-green { background: var(--bcg-green); color: #fff; }
  .badge-gold { background: var(--bcg-gold); color: var(--bcg-green); }

  /* Progress */
  .progress-bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--bcg-green); transition: width .5s ease; }
  .dark .progress-fill { background: var(--bcg-gold); }

  /* Stat */
  .stat-num { font-family: 'Merriweather', serif; font-weight: 900; font-size: 28px; color: var(--bcg-green); line-height: 1.1; }
  .dark .stat-num { color: var(--bcg-gold); }

  /* Table */
  table.kb { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.kb th, table.kb td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); }
  table.kb th { background: var(--bcg-green); color: var(--bcg-gold); font-weight: 600; font-size: 11.5px; letter-spacing: .3px; text-transform: uppercase; }
  table.kb tr:hover td { background: rgba(216,195,165,.06); }

  /* Form */
  input[type=text], input[type=email], select {
    background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 14px; color: inherit; width: 100%; font-family: 'Inter', sans-serif;
  }
  input[type=text]:focus, input[type=email]:focus, select:focus { outline: none; border-color: var(--bcg-green); box-shadow: 0 0 0 3px rgba(0,64,48,.08); }
  .dark input[type=text]:focus, .dark input[type=email]:focus, .dark select:focus { border-color: var(--bcg-gold); box-shadow: 0 0 0 3px rgba(216,195,165,.10); }

  /* Animation */
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade-in { animation: fadeInUp 0.5s ease-out forwards; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  .dark ::-webkit-scrollbar-thumb { background: #475569; }

  /* UI decoration — no select */
  header, footer, button, .ui-decoration { -webkit-user-select: none; user-select: none; }
  input, textarea, select { -webkit-user-select: text; user-select: text; }

  /* Toast */
  .toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: var(--bcg-green); color: var(--bcg-gold); padding: 12px 24px; border-radius: 10px; font-size: 13px; font-family: 'Inter', sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,.2); z-index: 9999; animation: fadeInUp 0.3s ease-out; }

  /* Serif headings */
  .serif { font-family: 'Merriweather', serif; }
  .h-display { font-family: 'Merriweather', serif; font-weight: 900; color: var(--bcg-green); }
  .dark .h-display { color: var(--bcg-gold); }

  /* Header brand */
  .brand-mark { font-family: 'Merriweather', serif; font-weight: 900; letter-spacing: 3px; color: var(--bcg-gold); }
</style>

<!-- ============= Domain Lock + Iframe Busting ============= -->
<script>
(function(){
  var ALLOWED = ['lolopodcast.github.io','localhost','127.0.0.1'];
  var REDIRECT = 'https://www.ibs.ncnu.edu.tw/index.php/faculty/tenured-professor/299-smlo';
  var host = location.hostname;
  var isFile = (location.protocol === 'file:');
  if (!isFile && host !== '' && !ALLOWED.some(function(d){ return host === d || host.endsWith('.'+d); })) {
    document.body.innerHTML = '<div style="text-align:center;padding:60px;font-family:sans-serif"><h1>Access Denied</h1><p>This resource is not authorised on this domain.</p></div>';
    setTimeout(function(){ location.href = REDIRECT; }, 3000);
    return;
  }
  // ---- Iframe Busting（一次性，避免在 App 內建瀏覽器造成無限自我導向）----
  try {
    if (window.self !== window.top && !sessionStorage.getItem('_fb')) {
      sessionStorage.setItem('_fb', '1');
      window.top.location.href = window.self.location.href;
    }
  } catch (e) { /* 跨來源或無 sessionStorage：放行，寧可顯示內容也不要卡死 */ }
})();
</script>

<!-- ============= 智慧型前端防護 ============= -->
<script>
(function(){
  // 版權提示 toast
  let toastTimer = null;
  window._showCopyrightToast = function(msg) {
    const existing = document.getElementById('_copyright_toast');
    if (existing) existing.remove();
    const el = document.createElement('div');
    el.id = '_copyright_toast';
    el.className = 'toast';
    el.textContent = msg || '© Intellectual Property of Prof. Shihmin Lo';
    document.body.appendChild(el);
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 2200);
  };

  // 智慧型右鍵：有選取文字 → 允許；圖片/SVG/空白處 → 攔截
  document.addEventListener('contextmenu', function(e) {
    const selection = window.getSelection().toString().trim();
    if (selection.length > 0) return true;
    const isImage = e.target.tagName === 'IMG' || e.target.closest('svg');
    e.preventDefault();
    window._showCopyrightToast(isImage ? '© Image protected · Prof. Shihmin Lo' : '© Intellectual Property of Prof. Shihmin Lo');
  });

  // 快捷鍵：F12 / Ctrl+U / Ctrl+Shift+I/J/C 攔截，Ctrl+P/S 開放
  document.addEventListener('keydown', function(e) {
    if (e.key === 'F12') { e.preventDefault(); window._showCopyrightToast(); return; }
    if (e.ctrlKey && e.key && e.key.toLowerCase() === 'u') { e.preventDefault(); window._showCopyrightToast(); return; }
    if (e.ctrlKey && e.shiftKey && ['i','j','c'].includes((e.key||'').toLowerCase())) {
      e.preventDefault(); window._showCopyrightToast(); return;
    }
  });

  // 圖片拖曳攔截
  document.addEventListener('dragstart', function(e) {
    if (e.target.tagName === 'IMG' || e.target.closest('svg')) e.preventDefault();
  });
})();
</script>

const LS_KEY = "aai_kb_quiz_state_v1";
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultState();
    return {
      ...defaultState(),
      ...JSON.parse(raw)
    };
  } catch (e) {
    return defaultState();
  }
}
function defaultState() {
  return {
    profile: {
      name: "",
      studentId: "",
      email: "",
      group: ""
    },
    theme: "dark",
    attempts: {},
    sessions: []
  };
}
function saveState(s) {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(s));
  } catch (e) {}
}
