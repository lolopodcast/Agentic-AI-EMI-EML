<!-- ============= Domain Lock + Iframe Busting ============= -->
<script>
(function(){
  var ALLOWED = ['lolopodcast.github.io','localhost','127.0.0.1'];
  var REDIRECT = 'https://www.ibs.ncnu.edu.tw/index.php/faculty/tenured-professor/299-smlo';
  var host = location.hostname;
  var isFile = (location.protocol === 'file:');
  if (!isFile && host !== '' && !ALLOWED.some(function(d){ return host === d || host.endsWith('.'+d); })) {
    document.body.innerHTML = '<div style="text-align:center;padding:60px;font-family:sans-serif"><h1>Access Denied</h1><p>This resource is not authorised on this domain.</p></div>';
    setTimeout(function(){ location.href = REDIRECT; }, 3000);
    return;
  }
  if (window.self !== window.top) {
    try { window.top.location.href = window.self.location.href; }
    catch(e) { document.body.innerHTML = '<div style="text-align:center;padding:60px;font-family:sans-serif"><h1>Frame Blocked</h1><p>This content cannot be embedded.</p></div>'; }
  }
})();
</script>

<script>
(function(){
  // 版權提示 toast
  let toastTimer = null;
  window._showCopyrightToast = function(msg) {
    const existing = document.getElementById('_copyright_toast');
    if (existing) existing.remove();
    const el = document.createElement('div');
    el.id = '_copyright_toast';
    el.className = 'toast';
    el.textContent = msg || '© Intellectual Property of Prof. Shihmin Lo';
    document.body.appendChild(el);
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 2200);
  };

  // 智慧型右鍵：有選取文字 → 允許；圖片/SVG/空白處 → 攔截
  document.addEventListener('contextmenu', function(e) {
    const selection = window.getSelection().toString().trim();
    if (selection.length > 0) return true;
    const isImage = e.target.tagName === 'IMG' || e.target.closest('svg');
    e.preventDefault();
    window._showCopyrightToast(isImage ? '© Image protected · Prof. Shihmin Lo' : '© Intellectual Property of Prof. Shihmin Lo');
  });

  // 快捷鍵：F12 / Ctrl+U / Ctrl+Shift+I/J/C 攔截，Ctrl+P/S 開放
  document.addEventListener('keydown', function(e) {
    if (e.key === 'F12') { e.preventDefault(); window._showCopyrightToast(); return; }
    if (e.ctrlKey && e.key && e.key.toLowerCase() === 'u') { e.preventDefault(); window._showCopyrightToast(); return; }
    if (e.ctrlKey && e.shiftKey && ['i','j','c'].includes((e.key||'').toLowerCase())) {
      e.preventDefault(); window._showCopyrightToast(); return;
    }
  });

  // 圖片拖曳攔截
  document.addEventListener('dragstart', function(e) {
    if (e.target.tagName === 'IMG' || e.target.closest('svg')) e.preventDefault();
  });
})();
</script>

const LS_KEY = "aai_kb_quiz_state_v1";
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultState();
    return { ...defaultState(), ...JSON.parse(raw) };
  } catch (e) { return defaultState(); }
}
function defaultState() {
  return {
    profile: { name: "", studentId: "", email: "", group: "" },
    theme: "dark",
    attempts: {},
    sessions: [],
  };
}
function saveState(s) { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) {} }

function Bi({ zh, en, primary='zh', sizeZh='text-base', sizeEn='text-sm', muteEn=true, className='' }) {
  if (!zh && !en) return null;
  if (primary === 'zh') {
    return (
      <div className={className}>
        {zh && <div className={`${sizeZh}`}>{zh}</div>}
        {en && <div className={`${sizeEn} ${muteEn ? 'opacity-70 italic' : ''} mt-0.5`}>{en}</div>}
      </div>
    );
  }
  return (
    <div className={className}>
      {en && <div className={`${sizeZh}`}>{en}</div>}
      {zh && <div className={`${sizeEn} ${muteEn ? 'opacity-70' : ''} mt-0.5`}>{zh}</div>}
    </div>
  );
}

// ============================================================
// Error Boundary — 防白屏
// ============================================================
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('ErrorBoundary:', error, info); }
  reset = () => this.setState({ error: null });
  render() {
    if (this.state.error) {
      return (
        <div style={{padding:'40px 20px',maxWidth:'600px',margin:'40px auto',fontFamily:'Inter,sans-serif'}}>
          <div className="bcg-card" style={{padding:'24px'}}>
            <h2 className="serif font-bold text-xl" style={{color:'var(--bad)',marginBottom:'12px'}}>
              ⚠ 發生錯誤 / An error occurred
            </h2>
            <p className="text-sm" style={{marginBottom:'12px'}}>頁面渲染時遇到問題。你的作答紀錄仍儲存在本機，不會遺失。</p>
            <p className="text-xs italic opacity-70" style={{marginBottom:'16px'}}>
              The page hit an error. Your records are still saved locally.
            </p>
            <details style={{marginBottom:'16px',fontSize:'12px',background:'rgba(0,0,0,.04)',padding:'8px 12px',borderRadius:'6px'}}>
              <summary style={{cursor:'pointer'}}>技術訊息 / Technical details</summary>
              <pre style={{whiteSpace:'pre-wrap',marginTop:'8px',fontSize:'11px'}}>{String(this.state.error?.stack || this.state.error)}</pre>
            </details>
            <button className="bcg-btn" onClick={this.reset}>重試 / Try again</button>
            <button className="bcg-btn-ghost" style={{marginLeft:'8px'}} onClick={() => location.reload()}>重新載入 / Reload</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function App() {
  const [state, setState] = useState(loadState());
  const [view, setView] = useState("home");
  const [activeTopic, setActiveTopic] = useState(null);
  const [quizSession, setQuizSession] = useState(null);

  useEffect(() => { saveState(state); }, [state]);
  useEffect(() => { document.documentElement.classList.toggle("dark", state.theme === "dark"); }, [state.theme]);

  function startQuiz(topic) {
    setActiveTopic(topic);
    setQuizSession({
      topicId: topic.id,
      startTs: Date.now(),
      qStartTs: Date.now(),
      curIdx: 0,
      answers: new Array(topic.questions.length).fill(null),
    });
    setView("quiz");
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function recordAnswer(idx, chosen, timeSec) {
    const topic = activeTopic;
    const q = topic.questions[idx];
    const correctIdx = _d(q.ans);
    const correct = chosen === correctIdx;
    const key = `${topic.id}:${idx}`;
    setState(s => {
      const arr = s.attempts[key] ? [...s.attempts[key]] : [];
      arr.push({ correct, timeSec, ts: Date.now(), chosen });
      return { ...s, attempts: { ...s.attempts, [key]: arr } };
    });
  }

  function submitQuiz() {
    const topic = activeTopic;
    const answers = quizSession.answers;
    let correctCount = 0;
    answers.forEach((a, i) => {
      if (a && a.chosen === _d(topic.questions[i].ans)) correctCount++;
    });
    const totalTime = Math.round((Date.now() - quizSession.startTs) / 1000);
    const summary = {
      topicId: topic.id,
      ts: Date.now(),
      correctCount,
      total: topic.questions.length,
      totalTimeSec: totalTime,
      answersSnap: answers,
    };
    setState(s => ({ ...s, sessions: [...s.sessions, summary] }));
    setQuizSession({ ...quizSession, finished: true, summary });
    setView("result");
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function retryQuiz() { startQuiz(activeTopic); }

  function nextTopic() {
    const idx = TOPICS.findIndex(t => t.id === activeTopic.id);
    if (idx < TOPICS.length - 1) startQuiz(TOPICS[idx + 1]);
    else { setView("dashboard"); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  }

  return (
    <div className="min-h-screen flex flex-col">
      <Header state={state} setState={setState} setView={setView} />
      <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 pb-12 pt-6 animate-fade-in" key={view}>
        {view === "home" && <Home state={state} onStart={startQuiz} setView={setView} />}
        {view === "profile" && <Profile state={state} setState={setState} setView={setView} />}
        {view === "quiz" && quizSession && activeTopic && (
          <Quiz topic={activeTopic} session={quizSession} setSession={setQuizSession}
            recordAnswer={recordAnswer} submitQuiz={submitQuiz}
            cancel={() => { setView("home"); window.scrollTo({ top: 0, behavior: 'smooth' }); }} />
        )}
        {view === "result" && quizSession?.finished && activeTopic && (
          <Result topic={activeTopic} summary={quizSession.summary}
            onRetry={retryQuiz} onNext={nextTopic}
            onHome={() => { setView("home"); window.scrollTo({ top: 0, behavior: 'smooth' }); }}
            onDashboard={() => { setView("dashboard"); window.scrollTo({ top: 0, behavior: 'smooth' }); }} />
        )}
        {view === "dashboard" && <Dashboard state={state} setState={setState} setView={setView} />}
      </main>
      <Footer />
    </div>
  );
}

function computeTopicStats(state, topics) {
  const r = {};
  topics.forEach(tp => {
    let attempted = 0, lastCorrect = 0;
    tp.questions.forEach((_, qi) => {
      const arr = state.attempts[`${tp.id}:${qi}`];
      if (arr && arr.length > 0) {
        attempted++;
        if (arr[arr.length - 1].correct) lastCorrect++;
      }
    });
    r[tp.id] = { attempted, lastAccuracy: attempted > 0 ? lastCorrect / attempted : 0 };
  });
  return r;
}

function Quiz({ topic, session, setSession, recordAnswer, submitQuiz, cancel }) {
  const q = topic.questions[session.curIdx];
  const cur = session.answers[session.curIdx];
  const correctIdx = _d(q.ans);
  // reveal 由「該題是否已作答」直接推導，不用 useState（避免 race condition）
  const reveal = cur != null;

  useEffect(() => {
    // 切換題目時，若該題尚未作答才重設計時起點
    if (session.answers[session.curIdx] == null) {
      setSession(s => ({ ...s, qStartTs: Date.now() }));
    }
  }, [session.curIdx]);

  function choose(i) {
    if (reveal) return;
    const timeSec = Math.round((Date.now() - session.qStartTs) / 1000);
    const newAnswers = [...session.answers];
    newAnswers[session.curIdx] = { chosen: i, timeSec };
    setSession(s => ({ ...s, answers: newAnswers }));
    recordAnswer(session.curIdx, i, timeSec);
  }

  function go(delta) {
    const newIdx = session.curIdx + delta;
    if (newIdx < 0 || newIdx >= topic.questions.length) return;
    setSession(s => ({ ...s, curIdx: newIdx }));
  }

  const allAnswered = session.answers.every(a => a !== null);
  const progress = (session.curIdx + 1) / topic.questions.length;
  const isCorrect = cur && cur.chosen === correctIdx;

  return (
    <div>
      {/* Topic header */}
      <div className="flex items-center justify-between mb-2">
        <div>
          <div className="badge badge-gold mb-1">TOPIC · {topic.titleEn}</div>
          <h2 className="serif font-bold text-xl">
            <span>{topic.titleZh}</span>
            <span className="italic font-normal text-sm opacity-70 ml-2">· {topic.titleEn}</span>
          </h2>
        </div>
        <button className="text-xs underline opacity-70 hover:opacity-100" onClick={cancel}>
          退出 / Exit
        </button>
      </div>
      <div className="text-xs mb-2 opacity-70">
        第 {session.curIdx + 1} 題 / Question {session.curIdx + 1} of {topic.questions.length}
      </div>
      <div className="progress-bar mb-6"><div className="progress-fill" style={{ width: `${progress * 100}%` }}></div></div>

      {/* Question card */}
      <div className="bcg-card p-6 mb-4">
        <div className="serif font-bold text-base sm:text-lg leading-relaxed">{q.qZh}</div>
        <div className="serif italic text-sm mt-1.5 opacity-75">{q.qEn}</div>

        <div className="space-y-2.5 mt-6">
          {q.optsZh.map((optZh, i) => {
            const optEn = q.optsEn[i];
            const isChosen = cur && cur.chosen === i;
            let cls = "opt";
            if (reveal) {
              if (i === correctIdx) cls += " correct";
              else if (isChosen) cls += " wrong";
            } else if (isChosen) cls += " selected";
            return (
              <div key={i} className={cls} onClick={() => choose(i)}>
                <div className="flex items-start gap-3">
                  <div className="serif font-bold text-base shrink-0" style={{minWidth:'22px',color:'var(--bcg-green)'}}>{String.fromCharCode(65 + i)}</div>
                  <div className="flex-1">
                    <div className="text-sm font-medium">{optZh}</div>
                    <div className="text-xs italic opacity-70 mt-0.5">{optEn}</div>
                  </div>
                  {reveal && i === correctIdx && <span className="serif font-bold" style={{color:'var(--ok)'}}>✓</span>}
                  {reveal && isChosen && i !== correctIdx && <span className="serif font-bold" style={{color:'var(--bad)'}}>✗</span>}
                </div>
              </div>
            );
          })}
        </div>

        {reveal && (
          <div className="mt-6 p-4 rounded-lg animate-fade-in" style={{
            background: isCorrect ? 'rgba(47,125,79,.08)' : 'rgba(179,38,30,.06)',
            border: `1px solid ${isCorrect ? 'var(--ok)' : 'var(--bad)'}`,
          }}>
            <div className="serif font-bold text-sm mb-2" style={{color: isCorrect ? 'var(--ok)' : 'var(--bad)'}}>
              {isCorrect ? '✓ 答對了！ Correct!' : '✗ 答錯了 Incorrect'}
            </div>
            <div className="text-sm leading-relaxed">{q.expZh}</div>
            <div className="text-xs italic opacity-75 mt-1">{q.expEn}</div>
            <div className="text-[11px] mt-3 opacity-60">⏱ {cur.timeSec}s</div>
          </div>
        )}
      </div>

      {/* Nav buttons */}
      <div className="flex justify-between items-center">
        <button className="bcg-btn-ghost" onClick={() => go(-1)} disabled={session.curIdx === 0}>← 上一題 / Prev</button>
        <div className="text-xs opacity-70">
          已作答 / Answered: <span className="font-semibold">{session.answers.filter(a => a !== null).length}</span> / {topic.questions.length}
        </div>
        {session.curIdx < topic.questions.length - 1 ? (
          <button className="bcg-btn" onClick={() => go(1)}>下一題 / Next →</button>
        ) : (
          <button className="bcg-btn" onClick={submitQuiz} disabled={!allAnswered}>送出 / Submit ✓</button>
        )}
      </div>
    </div>
  );
}

function Dashboard({ state, setState, setView }) {
  const overall = useMemo(() => {
    let totalAttempts = 0, totalCorrect = 0, totalTime = 0;
    Object.values(state.attempts).forEach(arr => {
      arr.forEach(a => {
        totalAttempts++;
        if (a.correct) totalCorrect++;
        totalTime += a.timeSec || 0;
      });
    });
    return {
      totalAttempts, totalCorrect, totalTime,
      accuracy: totalAttempts ? totalCorrect / totalAttempts : 0,
      avgTime: totalAttempts ? totalTime / totalAttempts : 0,
    };
  }, [state.attempts]);

  const perQuestion = useMemo(() => {
    const rows = [];
    TOPICS.forEach(topic => {
      topic.questions.forEach((q, qi) => {
        const arr = state.attempts[`${topic.id}:${qi}`] || [];
        const correct = arr.filter(a => a.correct).length;
        const avgT = arr.length ? arr.reduce((s, a) => s + a.timeSec, 0) / arr.length : 0;
        rows.push({
          topicId: topic.id,
          topicLabelZh: topic.titleZh,
          topicLabelEn: topic.titleEn,
          qIdx: qi,
          qLabelZh: q.qZh.slice(0, 36) + (q.qZh.length > 36 ? "…" : ""),
          attempts: arr.length,
          accuracy: arr.length ? correct / arr.length : 0,
          avgTime: avgT,
          lastCorrect: arr.length ? arr[arr.length - 1].correct : null,
        });
      });
    });
    return rows;
  }, [state.attempts]);

  const topicEvolution = useMemo(() => {
    const map = {};
    TOPICS.forEach(t => { map[t.id] = []; });
    state.sessions.forEach(s => {
      if (map[s.topicId]) {
        map[s.topicId].push({ ts: s.ts, accuracy: s.correctCount / s.total, time: s.totalTimeSec });
      }
    });
    return map;
  }, [state.sessions]);

  function exportCSV() {
    const rows = [];
    rows.push(["section", "field1", "field2", "field3", "field4", "field5", "field6", "field7"]);
    rows.push(["profile", "name", state.profile.name || "", "studentId", state.profile.studentId || "", "group", state.profile.group || "", state.profile.email || ""]);
    rows.push([]);
    rows.push(["per_question", "topicZh", "topicEn", "qIdx", "attempts", "accuracy", "avgTimeSec", "lastCorrect"]);
    perQuestion.forEach(r => {
      rows.push(["per_question", r.topicLabelZh, r.topicLabelEn, r.qIdx + 1, r.attempts, r.accuracy.toFixed(3), r.avgTime.toFixed(1), r.lastCorrect === null ? "" : r.lastCorrect]);
    });
    rows.push([]);
    rows.push(["session", "topicZh", "ts", "correctCount", "total", "accuracy", "totalTimeSec", ""]);
    state.sessions.forEach(s => {
      const tp = TOPICS.find(t => t.id === s.topicId);
      rows.push(["session", tp?.titleZh || s.topicId, new Date(s.ts).toISOString(), s.correctCount, s.total, (s.correctCount / s.total).toFixed(3), s.totalTimeSec, ""]);
    });
    rows.push([]);
    rows.push(["raw_attempt", "topicZh", "qIdx", "correct", "timeSec", "ts", "chosen", ""]);
    Object.entries(state.attempts).forEach(([k, arr]) => {
      const [tid, qi] = k.split(":");
      const tp = TOPICS.find(t => t.id === tid);
      arr.forEach(a => {
        rows.push(["raw_attempt", tp?.titleZh || tid, Number(qi) + 1, a.correct, a.timeSec, new Date(a.ts).toISOString(), a.chosen, ""]);
      });
    });
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
    const safeName = sanitizeName(state.profile.name).replace(/\s+/g, '_') || "anon";
    const safeId = sanitizeStudentId(state.profile.studentId) || "noid";
    a.href = url;
    a.download = `逢甲AI工作坊_母KB測驗_${safeName}_${safeId}_${stamp}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function resetAll() {
    if (confirm("確定要清除所有作答紀錄？此動作無法復原。\nClear all attempt records? This cannot be undone.")) {
      setState(s => ({ ...s, attempts: {}, sessions: [] }));
    }
  }

  return (
    <div>
      <div className="flex flex-wrap items-center gap-3 mb-5">
        <div className="flex-1">
          <h2 className="h-display text-2xl">學習儀表板</h2>
          <div className="serif italic text-sm opacity-70" style={{color:'var(--mute)'}}>Learning Dashboard</div>
        </div>
        <button className="bcg-btn flex items-center gap-2" onClick={exportCSV}>
          <Icon.Download size={16} /> 匯出 CSV / Export
        </button>
        <button className="bcg-btn-ghost" onClick={resetAll}>清除 / Reset</button>
      </div>

      {state.profile.name && (
        <div className="bcg-card-cream p-4 mb-5 text-sm">
          <span className="opacity-70">作答者 / Learner：</span>
          <span className="font-semibold">{state.profile.name}</span>
          {state.profile.studentId && <span className="ml-3 opacity-70">ID: {state.profile.studentId}</span>}
          {state.profile.group && <span className="ml-3 opacity-70">組別 / Group: {state.profile.group}</span>}
          {state.profile.email && <span className="ml-3 opacity-70">{state.profile.email}</span>}
        </div>
      )}

      {/* KPI cards */}
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
        <StatBox value={overall.totalAttempts} labelZh="總作答次數" labelEn="Total Attempts" />
        <StatBox value={`${Math.round(overall.accuracy * 100)}%`} labelZh="整體正確率" labelEn="Overall Accuracy" />
        <StatBox value={fmtTime(overall.totalTime)} labelZh="總花費時間" labelEn="Total Time" />
        <StatBox value={`${overall.avgTime.toFixed(1)}s`} labelZh="平均每題時間" labelEn="Avg Time / Q" />
      </div>

      {/* Evolution */}
      <div className="bcg-card p-5 mb-6">
        <div className="serif font-bold text-lg mb-3" style={{color:'var(--bcg-green)'}}>
          各主題正確率演進
          <span className="serif italic font-normal text-sm opacity-70 ml-2">· Accuracy Evolution per Topic</span>
        </div>
        <div className="space-y-3">
          {TOPICS.map(tp => {
            const ev = topicEvolution[tp.id];
            if (ev.length === 0) {
              return (
                <div key={tp.id} className="text-xs flex items-center gap-3 py-1">
                  <div className="font-medium" style={{ minWidth: 160 }}>{tp.titleZh}</div>
                  <div className="italic opacity-60">尚未測驗 / Not yet attempted</div>
                </div>
              );
            }
            return <SparkRow key={tp.id} labelZh={tp.titleZh} labelEn={tp.titleEn} points={ev} />;
          })}
        </div>
      </div>

      {/* Per-question table */}
      <div className="bcg-card p-5 mb-6">
        <div className="serif font-bold text-lg mb-3" style={{color:'var(--bcg-green)'}}>
          各題練習紀錄
          <span className="serif italic font-normal text-sm opacity-70 ml-2">· Per-Question Practice Record</span>
        </div>
        <div className="overflow-x-auto">
          <table className="kb">
            <thead>
              <tr>
                <th>主題 · Topic</th>
                <th>#</th>
                <th>題目 · Question</th>
                <th>次數 · Atts</th>
                <th>正確率 · Acc</th>
                <th>均時 · AvgT</th>
                <th>上次 · Last</th>
              </tr>
            </thead>
            <tbody>
              {perQuestion.map((r, i) => (
                <tr key={i}>
                  <td className="text-xs">{r.topicLabelZh}</td>
                  <td>{r.qIdx + 1}</td>
                  <td className="text-xs">{r.qLabelZh}</td>
                  <td>{r.attempts}</td>
                  <td>{r.attempts > 0 ? `${Math.round(r.accuracy * 100)}%` : "—"}</td>
                  <td>{r.attempts > 0 ? `${r.avgTime.toFixed(1)}s` : "—"}</td>
                  <td>{r.lastCorrect === null ? "—" : r.lastCorrect ? <span style={{ color: "var(--ok)" }}>✓</span> : <span style={{ color: "var(--bad)" }}>✗</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* Session history */}
      <div className="bcg-card p-5">
        <div className="serif font-bold text-lg mb-3" style={{color:'var(--bcg-green)'}}>
          測驗會話紀錄
          <span className="serif italic font-normal text-sm opacity-70 ml-2">· Session History</span>
        </div>
        {state.sessions.length === 0 ? (
          <div className="text-sm italic opacity-60">尚無測驗紀錄 / No sessions yet.</div>
        ) : (
          <div className="overflow-x-auto">
            <table className="kb">
              <thead>
                <tr>
                  <th>時間 · Time</th>
                  <th>主題 · Topic</th>
                  <th>成績 · Score</th>
                  <th>正確率 · Acc</th>
                  <th>耗時 · Duration</th>
                </tr>
              </thead>
              <tbody>
                {[...state.sessions].reverse().map((s, i) => {
                  const tp = TOPICS.find(t => t.id === s.topicId);
                  return (
                    <tr key={i}>
                      <td className="text-xs">{new Date(s.ts).toLocaleString()}</td>
                      <td className="text-xs">{tp?.titleZh}</td>
                      <td>{s.correctCount}/{s.total}</td>
                      <td>{Math.round(s.correctCount / s.total * 100)}%</td>
                      <td>{fmtTime(s.totalTimeSec)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

function StatBox({ value, labelZh, labelEn }) {
  return (
    <div className="bcg-card p-4 text-center">
      <div className="stat-num">{value}</div>
      <div className="text-[11px] mt-1.5 leading-tight" style={{color:'var(--mute)'}}>
        <div>{labelZh}</div>
        <div className="italic opacity-80">{labelEn}</div>
      </div>
    </div>
  );
}

function SparkRow({ labelZh, labelEn, points }) {
  const W = 240, H = 36, PAD = 4;
  const xs = points.map((_, i) => PAD + i * ((W - 2 * PAD) / Math.max(points.length - 1, 1)));
  const ys = points.map(p => PAD + (1 - p.accuracy) * (H - 2 * PAD));
  const path = points.map((_, i) => `${i === 0 ? "M" : "L"} ${xs[i].toFixed(1)} ${ys[i].toFixed(1)}`).join(" ");
  const last = points[points.length - 1];
  return (
    <div className="flex items-center gap-3 text-xs flex-wrap">
      <div style={{ minWidth: 160 }}>
        <div className="font-medium">{labelZh}</div>
        <div className="italic opacity-70 text-[10.5px]">{labelEn}</div>
      </div>
      <svg width={W} height={H} className="shrink-0">
        <line x1={PAD} y1={H / 2} x2={W - PAD} y2={H / 2} stroke="var(--line)" strokeWidth="0.5" strokeDasharray="2 2" />
        <path d={path} fill="none" stroke="var(--bcg-green)" strokeWidth="1.5" className="dark-stroke-gold"/>
        {points.map((p, i) => (
          <circle key={i} cx={xs[i]} cy={ys[i]} r="3.5" fill={p.accuracy >= 0.75 ? "var(--ok)" : p.accuracy >= 0.5 ? "var(--bcg-green)" : "var(--bad)"} />
        ))}
      </svg>
      <div className="opacity-70">
        n={points.length} · latest <span className="font-semibold">{Math.round(last.accuracy * 100)}%</span>
      </div>
    </div>
  );
}

function fmtTime(s) {
  if (s < 60) return `${Math.round(s)}s`;
  const m = Math.floor(s / 60), ss = Math.round(s % 60);
  return `${m}m ${ss}s`;
}

// ============================================================
// Footer
// ============================================================
function Footer() {
  return (
    <footer className="bg-[#004030] text-[#D8C3A5] mt-auto">
      <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-2 text-xs">
        <div className="opacity-70">Version 2026.08.01 · For Educational Use Only</div>
        <div className="flex items-center gap-4">
          <span>Architect: <a href="https://www.ibs.ncnu.edu.tw/index.php/faculty/tenured-professor/299-smlo" target="_blank" rel="noopener" className="underline hover:text-white">Prof. Shihmin Lo</a></span>
          <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})} className="font-bold hover:text-white">Top ↑</button>
        </div>
      </div>
    </footer>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
</script>
</body>
