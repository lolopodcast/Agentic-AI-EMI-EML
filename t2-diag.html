<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>測試 2／環境診斷</title>
<style>
 body{font-family:-apple-system,"Noto Sans TC",sans-serif;background:#0f1a16;color:#e8e4d8;margin:0;padding:20px 16px}
 h1{font-size:20px;color:#D8C3A5;margin:0 0 4px}
 .sub{font-size:13px;opacity:.7;margin-bottom:18px}
 .row{border:1px solid #2a3d35;border-radius:10px;padding:11px 13px;margin-bottom:9px;background:#16241f}
 .k{font-size:12px;color:#9ab5a8;margin-bottom:3px}
 .v{font-size:14px;word-break:break-all;line-height:1.5}
 .ok{color:#6ee7a8}.bad{color:#ff8a80}.wait{color:#ffd479}
 button{width:100%;padding:15px;margin-top:14px;background:#D8C3A5;color:#004030;border:0;border-radius:10px;font-size:16px;font-weight:700}
 textarea{width:100%;height:150px;margin-top:12px;background:#0b1411;color:#e8e4d8;border:1px solid #2a3d35;border-radius:8px;font-size:12px;padding:9px;box-sizing:border-box}
</style>
</head>
<body>
<h1>測試 2／環境診斷</h1>
<div class="sub">這頁只用內建 JavaScript，不載入任何外部檔案。</div>
<div id="out"></div>
<button onclick="copyAll()">複製全部結果</button>
<textarea id="dump" readonly></textarea>

<script>
var R = [];
function add(k, v, cls){
  R.push(k + ': ' + v);
  var d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = '<div class="k">' + k + '</div><div class="v ' + (cls||'') + '">' + v + '</div>';
  document.getElementById('out').appendChild(d);
}

add('① 這頁的 JavaScript', '有執行 ✅', 'ok');
add('② 網址 hostname', location.hostname || '(空白)');
add('③ 通訊協定', location.protocol);
add('④ 是否被包在框架裡', (window.self !== window.top) ? '是 ⚠（iframe busting 會被觸發）' : '否 ✅',
    (window.self !== window.top) ? 'bad' : 'ok');
add('⑤ 螢幕 / 視窗', screen.width + '×' + screen.height + ' / ' + window.innerWidth + '×' + window.innerHeight);
add('⑥ 裝置記憶體', (navigator.deviceMemory || '未提供') + ' GB');
add('⑦ 瀏覽器識別碼 (UA)', navigator.userAgent);

// 測試能否載入外部 CDN 的 JavaScript（React）
var t0 = Date.now();
var s = document.createElement('script');
s.src = 'https://unpkg.com/react@18.3.1/umd/react.production.min.js';
s.crossOrigin = 'anonymous';
s.onload = function(){ add('⑧ 外部 CDN（unpkg）', '載入成功 ✅ ' + (Date.now()-t0) + 'ms', 'ok'); after(); };
s.onerror = function(){ add('⑧ 外部 CDN（unpkg）', '載入失敗 ❌ — 這就是主因', 'bad'); after(); };
setTimeout(function(){ if(!window.React && !window._done) { add('⑧ 外部 CDN（unpkg）', '逾時 8 秒未完成 ⚠', 'bad'); after(); } }, 8000);
document.head.appendChild(s);

function after(){
  if(window._done) return; window._done = true;
  add('⑨ React 是否可用', window.React ? ('是 ✅ v' + React.version) : '否 ❌', window.React ? 'ok' : 'bad');
  document.getElementById('dump').value = R.join('\n');
}
function copyAll(){
  var t = document.getElementById('dump');
  t.select(); t.setSelectionRange(0, 99999);
  try { document.execCommand('copy'); alert('已複製，請貼給老師'); }
  catch(e){ alert('請長按上方文字框全選複製'); }
}
</script>
</body>
</html>
