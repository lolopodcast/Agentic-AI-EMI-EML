    m5_p1: "板書用一個圓圈 ⓪ 標出第一個動作：把聽、說、讀、寫的素材全部轉成文字（數字）。語音要轉成逐字稿、圖像要經過 OCR、影片要抽出字幕或摘要。這一步看似瑣碎，卻是整條鏈的關鍵瓶頸——因為文字是目前 AI 處理成本最低、精確度最高、也最容易被檢索與版本控制的形式。多模態模型雖然可以直接吃圖片和影片，但在教學情境下，先落成文字仍然更可靠：文字可以被人校對、被版本控制、被搜尋、被引用。",
    m5_p2: "先把所有模態收斂為文字，AI 才好處理，人也才校對得動。這一步的品質，決定後面所有產出的天花板。",
    m5_p3: "收斂成文字之後，板書畫出一個分岔：給 AI 看，用 Markdown；給人看，用可視化產出。這個分岔非常重要，因為它解決了一個常見的混淆——很多人把「AI 讀得懂」和「人讀得舒服」當成同一件事，結果做出兩邊都不討好的文件。Markdown 之所以是給 AI 看的最佳格式，是因為它用最少的符號承載最多的結構：標題層級、清單、表格、程式碼區塊都有明確語法，AI 可以據此還原文件的邏輯骨架，而不必猜測排版意圖。",
    m5_p4: "接著是四階產出鏈。① KB → .md 是母版，也就是結構化的知識庫，所有後續產出都從這裡派生。② SVG（Scalable Vector Graph）是向量圖，優點是無限縮放不失真、檔案小、而且原始碼是文字，可以直接被 AI 生成與修改。③ SPA（Single Page App）存成單一 .html 檔，可以用瀏覽器直接開啟，不需要伺服器——這正是你現在正在閱讀的這份教材的形式。④ PWA（Progressive Web App）再往前一步，可以安裝到桌面，像原生應用程式一樣使用，並支援離線開啟。",
    m5_p5: "把這條鏈看懂之後會發現一個重要推論：真正該花力氣的地方是 ① KB，而不是 ②③④。因為只要 .md 母版寫得夠結構化，SVG、SPA、PWA 都可以由 AI 從同一份來源自動派生；反之，如果直接動手做網頁，內容就被鎖死在呈現層裡，換一種形式就得重做一次。這也回頭解釋了為什麼板書要先做知識庫，再做網頁——順序反了，工作量會以倍數放大。",
    m5_wrapup: "整條素材流可以壓成一句口訣：多模態進來，先收斂成文字；文字寫成 Markdown 知識庫當母版；母版再派生 SVG、SPA、PWA 給人看。價值集中在母版，呈現層是可拋棄的。教師實際操作時，只要守住一個紀律——每次課堂結束先把素材落成 .md，之後想做圖、做網頁、做離線 App，都只是換一個派生指令而已。",

    m6_nav: "6. 記憶與情境管理",
    m6_title: "記憶與情境：Context Window、Token 經濟學與 RAG",
    m6_overview: "板書右下角把技術限制寫得很清楚：記憶分短期與長期、作用域分全域／專案／Session、Context Window 有上限、於是產生 Token 經濟學、並用 RAG 補足。這一節說明這四者如何互相牽動。",
    m6_highlights: ["短期 vs. 長期記憶", "全域 claude.md", "專案 工作資料夾", "Session 對話回合", "Context Window", "Token 經濟學", "RAG"],
    m6_p1: "板書把記憶分成短期與長期兩個時間尺度。短期記憶存在於單次 Session 之內——你這一輪對話講過的話，AI 記得；關掉視窗，就消失了。長期記憶則必須被寫下來，而板書給的答案正是前一個模組的產出：寫成 Markdown 知識庫。這句推論很關鍵——把知識寫成 .md，不只是為了做網頁，更是把短期記憶轉為長期記憶的唯一可靠手段。沒有落成文件的討論，下一次協作等於從零開始。",
    m6_p2: "寫成 Markdown 知識庫，就是把短期記憶轉為長期記憶。沒有落成文件的討論，下一次等於從零開始。",
    m6_p3: "作用域分三層，板書寫得很精準。全域層是 claude.md，一份跨所有專案都會被讀到的設定檔，適合放不會變的偏好與規則。專案層是工作資料夾，生命週期等於這個專案，適合放這個主題專用的資料與慣例。Session 層是對話回合，只在這次對話有效。三層的設計邏輯是「變動頻率」：越不常變的放越上層，越情境性的放越下層。放錯層會出問題——把專案專用的規則寫進全域，會污染其他專案；把該長期保存的知識留在 Session，關掉就沒了。",
    m6_p4: "Context Window 是這一切的物理限制：一次能塞進去的資訊量有上限，超過就必須取捨。板書在框裡畫了 skill 與工作資料，並在下方寫出「工作資料 = Σ 資料 / 來源 / 資源 / 資產」。因為容量稀缺，就誕生了板書上那行標題——Token 經濟學：在有限的視窗與成本下，決定什麼該直接放進來、什麼該外掛。而外掛的手段就是 RAG（Retrieval-Augmented Generation，檢索增強生成）：把大量資料放在外部，需要時才檢索相關片段送進 Context Window。",
    m6_p5: "把三個概念串起來會看到一個閉合迴圈：Context Window 是稀缺資源，所以需要 Token 經濟學來決定配置；RAG 是擴充稀缺資源的手段；而 RAG 要有效，前提是外部資料必須夠結構化、夠好檢索——也就是必須是一份寫得好的 Markdown 知識庫。於是整份板書在這裡收口：知識庫不只是產出物，它同時是長期記憶的載體、也是 RAG 的燃料。",
    m6_wrapup: "記憶與情境管理是整份板書最技術、卻也最實用的一段。三個操作原則可以直接帶走：第一，重要的東西一定要落成 .md，否則它只是短期記憶；第二，依變動頻率決定放在全域、專案還是 Session；第三，Context Window 是有價資源，與其把所有資料塞進去，不如把它們整理好放在外面用 RAG 取用。做到這三點，AI 協作才會從一次性的驚喜，變成可累積的資產。",

    m7_nav: "7. 現場需求盤點",
    m7_title: "現場需求盤點：把 13 則回應變成可行動的資料",
    m7_overview: "工作坊現場以 Mentimeter 提問 Q2「您最想用 Vibe Coding 做什麼課程設計或課堂活動？」，14/20 人作答、共 13 則回應。本模組示範如何把這類開放式回應，從一牆便利貼變成可比較、可累積、能指導下一梯次課程設計的結構化資料——並且回頭驗證前六個模組的架構是否真的成立。",
    m7_highlights: ["Mentimeter Q2", "有效樣本 n = 12", "兩軸編碼", "功能軸 M·D·A·L·S", "位置軸 I-P-O", "痛點在閉合迴圈"],
    m7_p1: "現場的第一版編碼用了五個顏色：討論互動、評分評量、專主題（領域）、素材教材、載體網頁。作為即時工具它很稱職——五支螢光筆當場塗完，全場立刻看見回應集中在少數幾件事。但它有一個結構性問題：五個顏色其實混了四種不同的分類軸。討論與評量是「教學功能」，素材教材是「資源投入」，載體網頁是「技術形式」，專題領域則是「學科內容」。四軸壓進一組顏色的直接後果，就是半數項目必須塗兩色。",
    m7_p2: "顏色只有五個，分類軸卻有四種——這就是為什麼半數項目要塗兩色。多重編碼不是問題，問題是它在提醒你：這些類別彼此正交，本來就不該互斥。",
    m7_p3: "改版採兩軸。軸一是教學功能，五個互斥類別：M 素材／教材、D 討論／互動／引導、A 評量／評分／批改、L 學習歷程資料、S 領域鷹架。軸二是 I-P-O 位置：Input、Process、Output、Outcome。原本的「載體（網頁）」則從顏色降級為 [網頁] 記號——因為它從未單獨成立，永遠只作為配色出現；而在本教材的架構裡，載體本來就是手法的答案，不是需求的類別。",
    m7_p4: "相對於現場版本，改版做了三處實質修正。第一，把「學習歷程資料」獨立成類。原本被塗成評量（橘）的三則——了解小組討論參與、蒐集錯題與錯誤率、AI 對話紀錄 log——要的其實不是評分，而是把學習過程轉為可觀測資料。評量是對 Output 下判斷，歷程是對 Process 做觀測，正是本教材第 3 模組 Output vs. Outcome 的分野。第二，把「領域」一分為二：「即使不懂原理直接用模型」是繞過學習（AI 當工程師），「循序漸進學會敏捷專案管理」是產生學習（AI 當教練），兩者教學意涵完全相反，不可同色。第三，把「不要讓學生 copy and paste」從討論互動改歸評量——它訴求的是 AI 時代的評量效度，不是互動設計。",
    m7_p5: "編碼完成後，三項發現浮現。發現一：痛點在閉合迴圈，不在載體。12 則有效回應中，只有 1 則是單純的「做一個網頁」，其餘 11 則都跨越兩個以上的 I-P-O 位置，且 8 則落在 Process。教師要的不是漂亮的產出，而是學生做完之後怎麼收、怎麼評、怎麼回饋。發現二：其中三則不是三種需求，而是同一條共用管線的三個段落——素材 → 教材 → 討論 → 評分 → 成績計算，這條線與現場手寫稿右下角唯一畫完整的流程完全重合，也與第 3 模組的 I-P-O 同構。發現三：那兩則被拆開的領域鷹架，構成本次工作坊最尖銳的教學問題——當 AI 讓學生跳過 K 直接執行 S，那算不算學會？",
    m7_wrapup: "需求盤點的價值不在於分類本身，而在於分類讓結論可被檢驗。五色版本告訴你「大家想要五種東西」，兩軸版本告訴你「大家其實在描述同一條管線的不同段落，而且集中在 Process」——後者才能直接改寫下一梯次的主軸：從「做出一個 SPA」改為「補完一條 I-P-O 閉合迴圈」。同一套編碼表沿用到下一梯次，還能累積跨梯次的趨勢；本梯 n=12 只是單點，兩梯之後才開始有比較的意義。",

    m8_nav: "8. 教授即產品經理",
    m8_title: "教授即產品經理：把課程當成一個產品來經營",
    m8_overview: "板書第三頁一開始就寫下一組新的等式：教授 ＝ 產品經理（PM）／專案經理（PjM）。這一節把前面七個模組講過的事，整個換成商業語言再講一次——課程是產品，學生是目標客群，教師與助教是產品團隊，投入的時間是成本，學生真正拿到的是價值。換語言的目的不是趕時髦，而是讓「這門課到底為誰創造了什麼」這個問題無處可躲。",
    m8_highlights: ["PM / PjM", "課程 = 產品", "TA 的雙關", "價值主張", "價值傳遞", "AI-native 原生世代"],
    m8_p1: "產品經理（Product Manager）負責的是「做什麼、為誰做、為什麼值得做」；專案經理（Project Manager）負責的是「怎麼在期限與資源內把它做出來」。一位大學教師其實同時扛著這兩個角色：學期初決定課綱、教材與評量方式，是 PM 的工作；學期中控制進度、協調助教、處理突發狀況，是 PjM 的工作。板書把「教授 + Σ TA」框成一個產品團隊，把課程框成產品，把學生框成使用這個產品的人，整條對位一次到位。",
    m8_p2: "教授手上真正的產品不是講義，而是一屆一屆走出教室的學生。",
    m8_p3: "板書在這裡玩了一個刻意的雙關：TA 這兩個字母同時出現在管線的兩端，意思卻完全不同。供給端的 Σ TA 是 Teaching Assistant 助教，屬於團隊資源；需求端被圈起來的 TA 是 Target Audience 目標客群，屬於服務對象。同一個縮寫，一邊是「誰跟我一起做」，一邊是「我做給誰」。這個雙關值得記住，因為教學設計最常見的失誤，就是把心力全部花在供給端的安排上，卻從來沒有認真定義過需求端到底是誰。",
    m8_p4: "板書上被圈起來的另一個字是 Value。這裡的 Value 有兩層：價值主張（value proposition）是你宣稱這門課能為學生解決什麼、帶來什麼；價值傳遞（value delivery）是這個主張有沒有真的送到學生手上。兩者是兩個獨立的失敗點——主張錯了，你會做出一門沒人需要的好課；主張對但沒傳遞到，你會做出一門老師很滿意、學生沒接到的課。這正是模組三 Output ≠ Outcome 的商業版說法：Output 是你交出去的東西，Value Delivery 才是對方真的收到的東西。而模組七的發現一——痛點在閉合迴圈——說的正是價值傳遞這一段：課做出來了，收、評、饋沒接上，價值就停在半路。",
    m8_p5: "與 Value 相對的是 Price 與 Cost。在課程這個產品裡，成本不是學費，而是教師與助教實際燒掉的資源：備課時數、批改時數、回信時數、工具訂閱費用。把 Cost 放進視野的意義在於，它讓「這個做法值不值得」變成一個可以計算的問題。一個能提升 5% 學習成效但讓教師每週多花十小時的設計，跟一個提升 3% 但幾乎零成本的設計，哪一個該先做？沒有 Cost 這個變數，這個問題連問都問不出來。",
    m8_p6: "最後，板書在學生那一側寫下「不是單一群體（異質）」，旁邊立刻畫上常態分佈曲線，並在右方標註 AI-native 原生世代。這兩筆合起來說的是：你的目標客群既不是同質的，其屬性也正在發生結構性改變。異質性呼應了模組二的結論——不糾結兩端，推動整條分佈往前移；而 AI-native 則是更根本的變動：新一屆學生的預設起點已經不同，他們不是「學會用 AI 的人」，而是「一開始就有 AI 的人」。針對前一種人設計的課程，對後一種人往往失效。",
    m8_wrapup: "把教授換成產品經理，最大的收穫不是多一個頭銜，而是多一組必須回答的問題：我的目標客群是誰、他們的痛點是什麼、我主張的價值是什麼、這個價值有沒有真的傳遞到、我為此付出多少成本。這五個問題，任何一個答不上來，課程設計就只是在憑經驗微調。而在 AI-native 世代面前，憑經驗微調的風險比以往任何時候都高——因為經驗來自一個已經不存在的客群。",

    m9_overview: "板書第三頁下半部寫著一條公式：基本功 ＝ ① × ② × ③。這三項分別是取得需求、把內容變成知識庫與規格、以及用 Vibe Coding 把它驅動成產出。它們不是新東西——正是模組三那三個操作要素的深化版，但這一次補上了兩個關鍵：連結它們的是乘號而不是加號，而且整條線的末端會繞回起點，形成一個 Feedback Loop。",
    m9_highlights: ["基本功 = ①×②×③", "Needs = Pains + Gains", "KB.md → Spec", "圖譜化 × Schema", "Feedback Loop", "缺一即零"],
    m9_p1: "先看那個乘號。如果是加法，三項當中做好兩項仍有六成分數；但板書寫的是乘法，任何一項為零，整體就是零。這個寫法把三者的關係從「都很重要」提升為「互為前提」。需求抓錯，知識庫再完整也是在解一個沒人問的問題；知識庫沒建，Vibe Coding 只能讓 AI 憑空瞎編；沒有 Vibe Coding，前兩項就停在你的腦袋裡變不成東西。",
    m9_p2: "三項相乘，任一項為零，整體即為零。",
    m9_p3: "① 取得需求 ＝ Needs，而板書把 Needs 進一步拆成 Pains 與 Gains：學生想擺脫什麼、想獲得什麼。這一項最容易被跳過，因為教師往往覺得自己已經知道學生需要什麼。但模組八已經說明，需求是屬於目標客群的，不是設計者自己想的。模組七的 Mentimeter Q2 就是這一步的實作示範——一次現場提問、13 則回應、兩軸編碼，需求就從模糊的印象變成可以比較與累積的資料。",
    m9_p4: "② 是把內容變成 AI 用得上的東西，板書畫了一條完整的加工線：課程設計與課堂活動這兩種來源匯入 KB.md，再往下推到 Spec.，最後成為圖譜化與 Schema。這條線的每一段都有明確分工。KB.md 是母版，解決「知識有沒有被留下來」；Spec 是規格，解決「這一次要生成什麼」；圖譜化與 Schema 則解決「AI 找不找得到」——圖譜化把概念之間的關係連成網，Schema 把欄位與型別描述清楚。模組六說過 RAG 的檢索品質取決於外部資料的結構化程度，這一段就是那個結構化的具體做法。",
    m9_p5: "③ Vibe Coding 承接模組三，不再贅述：用自然語言把 ① 的需求與 ② 的知識庫驅動成模組五的四階產出鏈。真正的新東西在第四筆——Feedback Loop。板書從 ② 那兩個來源拉出一條線繞回 ①，意思是課程設計與課堂活動不只是往下游流動的素材，它們同時是往上游回傳的需求訊號。學生在課堂活動中卡在哪裡、問了什麼、做錯什麼，本身就是下一輪 Needs 的最佳資料來源。把課堂活動只當素材收集，就浪費了它一半的價值。",
    m9_p6: "把這一章與模組三並排，可以看到板書三頁之間的推進關係。模組三的 ① 題（Intention）在這裡變成 ① 取得需求，差別是意圖不再由教師自訂，而是從目標客群取得；模組三的 ② 資源／庫／料在這裡變成 KB.md 加上 Spec 與圖譜化，差別是從「一堆內容」升級為「可檢索的結構」；③ Vibe Coding 兩邊相同。而 Feedback Loop 與相乘關係則是模組三完全沒有的——前者把線性流程變成迴圈，後者把並列的三件事變成互為前提的三件事。換句話說，第三頁不是另起爐灶，而是把同一套架構從「有哪些東西」推進到「怎麼把它做扎實」。",
    m9_wrapup: "基本功這個詞用得很準：它指的不是更高深的技巧，而是那些做不好就什麼都撐不住的地方。三項相乘意味著沒有捷徑可走——不能靠工具很潮來補償需求沒抓對，也不能靠知識庫很完整來補償從來沒問過學生要什麼。而 Feedback Loop 則保證這件事不是一次性的：每跑完一輪，課堂活動就會產生新的需求訊號，下一輪的 ① 因此比上一輪更準。這正是模組二 SDL 自主學習的教師版本——一套會自己愈跑愈好的課程設計流程。",

      front: "基本功 ＝ ① × ② × ③",
      back: "取得需求 × 知識庫與規格 × Vibe Coding。板書寫的是乘號而非加號：任一項為零，整體即為零。"
    }, {

    m0_nav: "0. Executive Summary",
    m0_title: "Executive Summary: Three Things to Settle Before AI Enters the Classroom",
    m0_intro: "This interactive courseware is derived from the whiteboard notes of the FCU iLINK AI Faculty Workshop held on 31 July 2026. It addresses a single question: when Agentic AI can autonomously complete multi-step tasks, how should the role of a university teacher be redefined? The notes answer in three layers. The first is mindset. The word educate comes from e-duc-ate, meaning to draw out; teaching is therefore not transmission but guidance, elicitation and inspiration. Following that logic, EMI (English as a Medium of Instruction) is only a means, while the real destination is EML (English as a Medium of Learning) and ultimately SDL, self-directed learning. The second layer is architecture. All AI collaboration converges on I-P-O, that is Input, Process and Output, extended one step further to Outcome; what drives the whole chain is Intention, not tooling. The third layer is method. Convert every listening, speaking, reading and writing artefact into text, write it into a Markdown knowledge base as the master source, then derive three human-facing forms from it: SVG vector graphics, SPA single-page applications and PWA progressive web apps. Finally we return to the resource constraint. The context window is scarce, which gives rise to token economics and to RAG, retrieval-augmented generation. The nine learning modules unpack these three layers in sequence, and the Interactive Lab lets you run the arithmetic yourself.",
    m0_why: "Why does this matter only now?",
    m0_why_desc: "Generative AI has made output cheap, but learning outcomes have not improved automatically alongside it. When a student can generate a report in three seconds, a teacher who still inspects output is measuring an indicator that has lost its discriminating power. This courseware argues for moving the centre of assessment from Output to Outcome, that is, to genuine gains in aspiration and competency, where competency equals f(Knowledge, Skill, Attitude). That is precisely the part no Agentic AI can take over from a human teacher.",

    m1_nav: "1. Agentic AI and Human Intelligence",
    m1_title: "The Division of Labour Between Agentic AI and Human Intelligence",
    m1_overview: "The first pairing on the whiteboard is Agentic AI vs. H.I. (Human Intelligence). The point is not to rank them but to divide the work. Understanding AI collaboration begins with seeing the difference in autonomy between Assistant, Co-pilot and Agentic AI, and knowing which teaching tasks each is suited to carry.",
    m1_highlights: ["Agentic AI", "Human Intelligence", "Assistant by order", "Co-pilot", "Autonomy spectrum", "Coach / Butler / Engineer"],
    m1_p1: "An Assistant operates by order. You issue one instruction, it performs one action, then stops and waits. The benefit is control; the cost is that every step needs a human push, so the teacher's cognitive load does not actually fall. A Co-pilot goes one step further: it offers suggestions while you work, completing the sentence or the code you have started, yet you retain the initiative. Agentic AI is a change in kind. You give it an intention; it decomposes that into sub-tasks, chooses tools, executes, checks the result, retries where necessary, and hands the finished work back to you.",
    m1_p2: "What matters on this spectrum is not which end is more advanced, but how much judgement you are willing to delegate. The more you delegate, the more efficient the work, and the less visibility you retain over the process.",
    m1_p3: "The notes use three metaphors for the roles AI can play in a classroom. As a coach, AI trains alongside the student, gives feedback and points out blind spots; the student remains the protagonist. As a butler, AI handles chores such as cleaning up transcripts, formatting, retrieving sources and summarising, freeing human time for higher-order thinking. As an engineer, AI builds directly, turning an idea into a working artefact. None of these roles is inherently superior, but choosing the wrong one causes damage: let AI act as engineer on a student assignment and learning disappears; let it act as coach while the student thinks, and learning happens.",
    m1_p4: "Turn now to the H.I. side. In this architecture human intelligence is not competing on computational speed. It owns three things AI still does poorly: setting intention (deciding what is worth doing), judging value (deciding what counts as good) and bearing responsibility (deciding who answers for the result). These map precisely onto Intention, Outcome and the Attitude component of competency, all discussed in later modules. In other words, the stronger AI becomes, the more a teacher must concentrate on those three things rather than racing AI to produce output.",
    m1_wrapup: "Agentic AI is not a better Assistant; it is a different collaboration contract. An Assistant wants your instructions, Agentic AI wants your intention. That shift makes the ability to ask good questions more valuable than the ability to operate tools. For a teacher, the first practical decision is therefore not whether to use AI, but whether AI will act as coach, butler or engineer in this particular class, because that choice determines whether students are learning at all.",

      front: "Agentic AI",
      back: "AI that, given an intention, autonomously plans, selects tools, executes multi-step tasks, self-checks and delivers a finished result."
    }, {
      front: "H.I. (Human Intelligence)",
      back: "In the AI era it owns three irreplaceable tasks: setting intention, judging value and bearing responsibility."

    m2_nav: "2. EMI vs. EML: From Teaching to Learning",
    m2_title: "EMI vs. EML: The Etymology of Educate and the Competency Formula",
    m2_overview: "Page two of the whiteboard opens bluntly with 'Professing ✗ = Lecture', then routes Teaching towards Learning and Learning towards SDL, self-directed learning. This module handles the mindset layer: why EMI is only a means, why EML is the destination, and what formula finally measures teaching effectiveness.",
    m2_highlights: ["EMI = Instruction", "EML = Learning by Doing", "SDL", "educate = e-duc-ate", "Guide / Elicit / Inspire", "f(K, S, A)"],
    m2_p1: "EMI is English as a Medium of Instruction; its centre of gravity is Instruction. The teacher lectures in English, the teacher is the protagonist, and the verb is to teach. EML is English as a Medium of Learning; its centre of gravity is Learning by Doing, what the notes render as learning while doing. The protagonist becomes the student and the verb becomes to use. In the same class, if the teacher lectures in English while students merely listen, that is EMI; only when students must complete tasks, argue and produce in English does it become EML. The notes mark SDL, self-directed learning, as the terminus of EML, and the implication is clear: the goal of course design is that students can keep going on their own after the course ends.",
    m2_p2: "educate = e- + duc + -ate, etymologically 'to draw out'. Education was never about pushing knowledge in; it is about drawing out what the student already has — guiding, eliciting, inspiring.",
    m2_p3: "In the lower left of the whiteboard sits a normal distribution curve annotated 'leave it to fate / set aside → move forward'. The pedagogical reading is this: ability in any class approximates a normal distribution, and the extremes at either tail are largely governed by factors outside the classroom that a teacher cannot shift within a semester. What deserves real effort is nudging the whole distribution forward by one notch. This is a pragmatic view of classroom management. It does not abandon anyone; it acknowledges that resources are finite and spends them where the marginal return is highest.",
    m2_p4: "The targets of measurement are written to the right of the curve: raise aspiration and raise competency. Competency is defined as the capacity to perform, and expands into a formula: competency = f(K, S, A), where K is Knowledge, S is Skill and A is Attitude and values. This formula explains why assessment that tests only knowledge distorts the picture. K is one variable of three, and in an era when AI can supply K instantly, the relative weight of S and A must rise. A teacher who wants to demonstrate the value of a course must be able to explain how its design acts on all three variables at once.",
    m2_wrapup: "Compressed to a sentence: the verb of education is to draw out, not to pour in. EMI merely swaps the language of Instruction; EML swaps the protagonist back to the student. Assessment must follow — from checking how much K a student retains, to observing whether aspiration has been ignited and whether all three components of competency have grown together. When AI supplies K without limit, what remains for the teacher, and what is most precious, is S and A.",
    m2_terms: [{
      front: "EMI",
      back: "English as a Medium of Instruction. English as the vehicle of teaching; the centre of gravity is Instruction and the protagonist is the teacher."
    }, {
      front: "EML",
      back: "English as a Medium of Learning. English as the vehicle of learning, emphasising Learning by Doing; the protagonist is the student."
    }, {
      front: "SDL",
      back: "Self-Directed Learning. Marked on the whiteboard as the terminus of EML: students keep learning on their own after the course ends."
    }, {
      front: "Etymology of educate",
      back: "e- + duc + -ate, originally 'to draw out'. Education is guidance, elicitation and inspiration rather than transmission."
    }, {

    }, {
      front: "Shifting the distribution forward",
      back: "Accepting that class ability is roughly normal and the tails resist short-term change, teaching resources should push the whole distribution forward."
    }],
    m2_q: [{

    /* ---------- M3 ---------- */
    m3_nav: "3. The I-P-O Architecture",
    m3_title: "I-P-O: The Full Chain from Intention to Outcome",
    m3_overview: "In the centre of page one, highlighted in pink, sits '1. Basic Principle: the I-P-O architecture', with one crucial word appended after Output: Outcome. This module unpacks that chain and the three numbered elements hanging beneath it — intention, resources and vibe coding.",
    m3_highlights: ["Input–Process–Output", "Outcome ≠ Output", "① Intention / Goal", "② Resource · Repository", "③ Vibe Coding", "Natural vs. domain vs. code"],
    m3_p1: "Input–Process–Output is the most classical of systems frameworks, but the notes deliberately add Outcome after Output and draw an arrow up to 'goal setting'. That small gesture is the key to the whole diagram. Output is the thing you produced — a report, a web page, a piece of code. Outcome is the change it actually caused — improved competency, better decisions. Generative AI has slashed the cost of Output without automatically improving Outcome. If assessment still counts outputs, it is measuring an indicator that has already inflated.",
    m3_p2: "Output is what you hand over; Outcome is what you actually changed. AI made the former cheap and the latter harder to prove.",
    m3_p3: "① Intention drives the entire chain. The notes route it to 'goal setting' and, in the top right corner, circle a cluster of work units: project, task, job. This says intention cannot remain a feeling; it must land as a bounded unit of work — which is exactly why the next module insists on designating a working folder. ② Resource, repository and material are defined as content in any form, with two sources: captured live (produced in the moment) and existing stock (the repository accumulated in advance). The distinction is practical because it maps onto the two things teachers actually do — recording in class, and curating a teaching library over time.",
    m3_p4: "③ Vibe Coding is the only node on the whiteboard connected to both Co-pilot and Agentic AI, annotated 'by feel'. Its technical definition is directing a system in natural language rather than programming language. The notes then set three layers of language side by side: natural language (humans understand it), domain language (specialists understand it) and code (machines execute it). Historically, to make a computer act, a human had to descend to the code layer. The significance of vibe coding is that this threshold has been removed: you can stay at the natural language layer, and listening, speaking, reading and writing become the interface directly. That is why teachers without a computing background can build a usable teaching tool within a single workshop.",
    m3_wrapup: "The value of I-P-O is not novelty but sequence: it forces intention to the front, outcome to the back, and leaves tooling in the middle. The three numbered elements each answer one question: ① what am I trying to achieve, ② what do I have to work with, ③ how do I direct it. Without ①, AI produces something beautiful and irrelevant; without ②, it can only guess; without ③, you are doing the work yourself. With all three in place, Output has a chance of becoming Outcome.",
    m3_terms: [{
      front: "I-P-O",
      back: "The Input – Process – Output systems framework, extended in the notes to Outcome."
    }, {
      front: "Output vs. Outcome",
      back: "Output is the artefact (report, web page, code); Outcome is the change actually caused (competency gains, better decisions)."

      front: "Intention",

    /* ---------- M4 ---------- */
    m4_nav: "4. Environment: The Overlooked Step Zero",
    m4_title: "Environment: Why It Is Numbered Zero",
    m4_overview: "The whiteboard numbers environment as 0, placing it before every principle, with 'infrastructure' noted in brackets. This module explains why environment precedes method, and gives an operational checklist: the working folder, input devices and the tool stack.",
    m4_highlights: ["0. Environment", "Infrastructure", "Attention-based", "Designate a working folder", "Input devices", "tools = ΣAPIs + MCP + ΣSkills"],
    m4_p1: "Why number environment zero? Because environment determines two things that cannot be repaired afterwards. The first is vibe — the notes draw an arrow from environment to vibe, meaning the atmosphere and rhythm of the whole session. The second is attention, written explicitly on the board as 'attention-based'. Attention is the scarcest resource in any classroom, and it is almost entirely determined by environment: whether devices work, whether material is available on demand, whether students must spend effort fighting the interface. Get the environment wrong and no amount of elegant I-P-O will move.",
    m4_p2: "Environment is not a warm-up; it is a precondition. Attention is the scarcest resource in a classroom, and environment almost entirely determines it.",
    m4_p3: "The first concrete action is to designate a working folder. The notes circle this in the top right and connect it to project / task / job. Its significance exceeds tidiness: the working folder is the physical boundary of a project. It simultaneously defines what AI can and cannot see, and the memory scope of this collaboration. Next comes device configuration. A desktop camera converts what is physically present into image and text. Google Meet and Moodle / BBB produce video and audio. A timer governs pace. These three classes of device solve three distinct problems: can we see it, can we keep it, can we finish on time.",
    m4_p4: "Finally the tool stack, written on the board as an additive formula: tools = Σ APIs + MCP servers + Σ Skills. The division of labour is clear. APIs are interfaces to external capability, letting a system call functions it does not itself possess. MCP servers, the Model Context Protocol, are the standard way to plug external systems into AI — effectively giving AI pluggable hands and feet. Skills package a way of working into a reusable module, so a review procedure written today can be run unchanged tomorrow. The crucial symbol in that formula is Σ: capability accumulates, and every addition benefits every future project. That is why investment in environment yields a return that compounds over time.",
    m4_wrapup: "Environment is step zero because it is the one step that cannot be fixed retrospectively. Ask three questions before a course begins: is the working folder designated (boundary), can the input devices produce the material I need (supply), and does the tool stack contain the API, MCP or Skill this session requires (capability). Only when all three are yes should you enter I-P-O. And because tools accumulate as a Σ, that investment does not serve this class alone; it settles into the starting line for every class thereafter.",

    m5_nav: "5. Material Flow and the Four-Stage Chain",
    m5_title: "Material Flow: Listening and Speaking → Text → Four-Stage Output Chain",
    m5_overview: "The right half of the whiteboard is the most structurally complete passage in the notes: converge every modality into text, fork into 'for AI' and 'for humans', then expand into four numbered outputs — KB, SVG, SPA and PWA. This module threads them into a workable pipeline.",
    m5_highlights: ["⓪ Listening/speaking → text", "OCR / transcription", "For AI = Markdown", "① KB (.md)", "② SVG", "③ SPA", "④ PWA"],
    m5_p1: "A circled ⓪ marks the first action: convert all listening, speaking, reading and writing material into text (including numbers). Speech becomes a transcript, images pass through OCR, video yields captions or summaries. The step looks clerical but it is the bottleneck of the whole chain, because text is currently the form AI processes most cheaply and most accurately, and the form easiest to search and version-control. Multimodal models can ingest images and video directly, yet in a teaching context landing on text first remains more reliable: text can be proofread by humans, versioned, searched and cited.",
    m5_p2: "Converge every modality into text first, so AI can process it and humans can still proofread it. The quality of this step sets the ceiling for everything downstream.",
    m5_p3: "After convergence the notes draw a fork: for AI, use Markdown; for humans, use visual outputs. This fork matters because it resolves a common confusion — many people treat 'AI can read it' and 'humans find it comfortable' as the same requirement and end up producing documents that satisfy neither. Markdown is the best format for AI because it carries the most structure with the fewest symbols: heading levels, lists, tables and code blocks all have explicit syntax, so AI can reconstruct the logical skeleton without guessing at layout intent.",
    m5_p4: "Then comes the four-stage chain. ① KB → .md is the master source, a structured knowledge base from which everything else is derived. ② SVG (Scalable Vector Graph) is vector artwork: it scales without loss, files stay small, and its source is text, so AI can generate and edit it directly. ③ SPA (Single Page App) is saved as a single .html file that opens straight in a browser with no server — exactly the form of the courseware you are reading. ④ PWA (Progressive Web App) goes one step further: it installs to the desktop, behaves like a native application and works offline.",
    m5_p5: "Once the chain is clear, an important corollary follows: the effort belongs at ① KB, not at ②③④. So long as the .md master is sufficiently structured, SVG, SPA and PWA can all be derived by AI from the same source. Build the web page directly instead, and the content is locked inside the presentation layer, so changing format means starting over. This also explains the ordering on the whiteboard — knowledge base first, web page second. Reverse it and the workload multiplies.",
    m5_wrapup: "The whole material flow compresses into one rule: bring multimodal material in, converge it to text, write the text into a Markdown knowledge base as the master, then derive SVG, SPA and PWA for human readers. Value concentrates in the master; presentation layers are disposable. In practice a teacher need hold only one discipline — after each class, land the material as .md first. Diagrams, web pages and offline apps then become nothing more than a different derivation instruction.",

    m6_nav: "6. Memory and Context Management",
    m6_title: "Memory and Context: The Context Window, Token Economics and RAG",
    m6_overview: "The lower right of the whiteboard states the technical constraints plainly: memory splits into short and long term, scope splits into global / project / session, the context window has a ceiling, token economics follows, and RAG fills the gap. This module shows how the four interlock.",
    m6_highlights: ["Short vs. long-term memory", "Global claude.md", "Project working folder", "Session turn", "Context window", "Token economics", "RAG"],
    m6_p1: "The notes divide memory into two timescales. Short-term memory lives inside a single session: what you said this round, the AI remembers; close the window and it is gone. Long-term memory must be written down, and the answer the notes give is precisely the output of the previous module — write it into a Markdown knowledge base. That inference matters: writing knowledge as .md is not only about producing a web page, it is the only reliable way to convert short-term memory into long-term memory. A discussion that never lands as a document means the next collaboration starts from zero.",
    m6_p2: "Writing a Markdown knowledge base is how short-term memory becomes long-term memory. A discussion that never lands as a document means starting from zero next time.",
    m6_p3: "Scope divides into three precise layers. The global layer is claude.md, a configuration read across every project, suitable for preferences and rules that rarely change. The project layer is the working folder, whose lifecycle equals the project, suitable for topic-specific material and conventions. The session layer is the conversational turn, valid only for this exchange. The organising logic is rate of change: the less something changes, the higher its layer. Misplacing content causes real problems — writing project-specific rules into the global layer contaminates other projects, while leaving knowledge worth keeping in the session layer means losing it on close.",
    m6_p4: "The context window is the physical limit behind all of this: there is a ceiling on how much can be loaded at once, and beyond it you must choose. Inside the box the notes draw skill and working material, and beneath it write 'working material = Σ data / sources / resources / assets'. Because capacity is scarce, the heading on the board follows naturally — token economics: deciding, under a finite window and finite cost, what to place inside and what to attach externally. The mechanism for attaching externally is RAG, retrieval-augmented generation: keep the bulk of the material outside and retrieve only the relevant fragments into the window when needed.",
    m6_p5: "Threading the three concepts together reveals a closed loop. The context window is scarce, so token economics is needed to allocate it; RAG is the means of extending that scarce resource; and for RAG to work, the external material must be sufficiently structured and retrievable — that is, it must be a well-written Markdown knowledge base. The whiteboard closes here: the knowledge base is not merely an artefact, it is simultaneously the vessel of long-term memory and the fuel for RAG.",
    m6_wrapup: "Memory and context management is the most technical passage in the notes and also the most immediately useful. Three operating principles travel well. First, anything important must land as .md, otherwise it is only short-term memory. Second, decide global, project or session by rate of change. Third, the context window is a priced resource: rather than stuffing everything in, organise material well and retrieve it from outside via RAG. Do these three and AI collaboration shifts from a one-off delight into a compounding asset.",
    m6_terms: [{
      front: "Short-term memory",
      back: "Conversation content living inside a single session; it disappears when the window closes."
    }, {
      front: "Long-term memory",
      back: "Knowledge written into documents (a Markdown knowledge base) so it persists and can be reused across sessions."

    }, {
      front: "Token economics",
      back: "Allocating a finite context window and finite cost: what to place inside versus what to retrieve externally."

    /* ---------- M7 ---------- */
    m7_nav: "7. Coding the Room's Needs",
    m7_title: "Coding the Room's Needs: Turning 13 Responses into Actionable Data",
    m7_overview: "During the workshop a Mentimeter poll asked Q2: 'What would you most want to build with vibe coding — a course design or a classroom activity?' 14 of 20 participants replied, producing 13 responses. This module demonstrates how to turn open-ended responses of this kind from a wall of sticky notes into structured data that can be compared, accumulated and used to steer the next cohort — and, in doing so, tests whether the architecture of the previous six modules actually holds.",
    m7_highlights: ["Mentimeter Q2", "Valid n = 12", "Two-axis coding", "Function axis M·D·A·L·S", "Position axis I-P-O", "Pain is the closed loop"],
    m7_p1: "The first pass, done live, used five highlighter colours: discussion and interaction, grading and assessment, subject domain, material and courseware, and web as a carrier. As a live instrument it did its job — five pens, coded on the spot, and the room could immediately see that responses clustered around a handful of things. But it had a structural flaw: those five colours actually mixed four different classification axes. Discussion and assessment are teaching functions, material is a resource input, web-as-carrier is a technical form, and subject domain is disciplinary content. Compressing four axes into one colour set has a direct consequence: half the items needed two colours.",
    m7_p2: "Five colours, four axes — that is why half the items needed double-coding. Multiple codes are not the problem; the problem is what they reveal: these categories are orthogonal, so they were never mutually exclusive to begin with.",
    m7_p3: "The revision uses two axes. Axis one is teaching function, with five mutually exclusive categories: M material and courseware, D discussion and interaction, A assessment and grading, L learning-process data, and S domain scaffolding. Axis two is position in the I-P-O chain: Input, Process, Output, Outcome. The original 'web as carrier' is demoted from a colour to a [web] marker, because it never stood on its own and only ever appeared as a secondary code — and because, within this courseware's architecture, the carrier is an answer belonging to method, not a category of need.",
    m7_p4: "Three substantive corrections separate the revision from the live version. First, learning-process data becomes its own category. Three responses originally coloured as assessment — understanding participation in group discussion, collecting wrong answers and error rates, and logging students' AI conversations — are not asking for grading at all; they ask for the learning process to be made observable. Assessment judges Output, process data observes Process, which is exactly the Output versus Outcome distinction from module 3. Second, domain splits in two: using a model without understanding its principles bypasses learning (AI as engineer), whereas progressively learning agile project management produces learning (AI as coach). The two are pedagogically opposite and cannot share a colour. Third, 'an activity where students cannot just copy and paste from AI' moves from discussion to assessment — it is a question of assessment validity in the AI era, not of interaction design.",
    m7_p5: "Three findings emerge once the coding is done. Finding one: the pain is the closed loop, not the carrier. Of 12 valid responses, only one is purely 'build me a web page'; the other eleven span two or more I-P-O positions, and eight touch Process. Teachers are not asking for a handsome artefact; they are asking how to collect, judge and feed back on what students produce. Finding two: three of those responses are not three separate needs but three segments of one shared pipeline — material, courseware, discussion, grading, score computation — a line that coincides exactly with the only complete flow drawn on the handwritten sheet and is isomorphic to the I-P-O of module 3. Finding three: the two responses split apart under domain scaffolding pose the sharpest pedagogical question of the workshop — when AI lets a student skip K and execute S directly, has learning occurred?",
    m7_wrapup: "The value of a needs audit lies not in the categories themselves but in making the conclusion testable. The five-colour version says 'people want five kinds of thing'. The two-axis version says 'people are describing different segments of one pipeline, concentrated in Process' — and only the latter can rewrite the next cohort's spine, from 'build an SPA' to 'close one I-P-O loop'. Carry the same coding sheet into the next session and it also accumulates trend data; n = 12 here is a single point, and comparison only becomes meaningful after two cohorts.",

      back: "Tagging each response simultaneously along two independent axes — teaching function and I-P-O position — instead of one multi-colour axis."
    }, {

    /* ---------- M8 ---------- */
    m8_nav: "8. The Professor as Product Manager",
    m8_title: "The Professor as Product Manager: Running a Course Like a Product",
    m8_overview: "The third whiteboard page opens with a new equation: professor = product manager (PM) / project manager (PjM). This module retells everything from the previous seven modules in commercial language. The course is the product, students are the target audience, the teacher and teaching assistants are the product team, the hours invested are the cost, and what students actually walk away with is the value. Switching vocabulary is not a fashion statement; it leaves the question 'what exactly does this course create, and for whom' with nowhere to hide.",
    m8_highlights: ["PM / PjM", "Course = product", "The TA pun", "Value proposition", "Value delivery", "AI-native generation"],
    m8_p1: "A product manager owns what gets built, for whom, and why it is worth building. A project manager owns how it gets delivered within the deadline and the available resources. A university teacher in fact carries both roles at once: setting the syllabus, materials and assessment scheme at the start of term is PM work, while managing pace, coordinating assistants and absorbing surprises mid-term is PjM work. The whiteboard frames professor plus the sum of TAs as a product team, the course as the product, and the students as the people who use it. The mapping is complete in one stroke.",
    m8_p2: "The professor's real product is not the handout. It is the students who walk out of the room at the end of each cohort.",
    m8_p3: "There is a deliberate pun here: the letters TA appear at both ends of the pipeline and mean entirely different things. On the supply side, the sum of TAs means Teaching Assistants, a team resource. On the demand side, the circled TA means Target Audience, the people being served. The same abbreviation stands for 'who builds this with me' at one end and 'who I build this for' at the other. The pun is worth remembering, because the most common failure in instructional design is to spend all one's energy arranging the supply side while never seriously defining who the demand side is.",
    m8_p4: "The other circled word is Value, and it operates on two levels. The value proposition is what you claim the course will solve or provide for students. Value delivery is whether that claim actually reaches them. These are two independent points of failure: get the proposition wrong and you build an excellent course nobody needs; get it right but fail to deliver and you build a course the teacher is proud of and the students never received. This is the commercial phrasing of Output does not equal Outcome from module 3. Output is what you hand over; value delivery is what the other party actually receives. Module 7’s first finding — the pain is the closed loop — is precisely a value-delivery statement: the course exists, but if collect, assess and feed back never connect, the value stalls halfway.",
    m8_p5: "Standing opposite Value are Price and Cost. In this product, cost is not tuition; it is the resource the teacher and assistants genuinely burn — preparation hours, marking hours, email hours, tool subscriptions. Bringing cost into view turns 'is this approach worth it' into a question that can be computed. A design that lifts learning outcomes by five per cent but adds ten hours a week, versus one that lifts them by three per cent at almost no cost: which should come first? Without the cost variable, the question cannot even be asked.",
    m8_p6: "Finally, on the student side, the whiteboard writes 'not a single group (heterogeneous)', immediately draws a normal distribution beside it, and annotates the right margin with AI-native generation. Read together, these say that your target audience is neither homogeneous nor stable in its properties. Heterogeneity echoes module 2 — do not agonise over the tails, move the whole distribution forward. AI-native is the deeper shift: the incoming cohort's default starting point has changed. They are not people who learned to use AI; they are people for whom AI was always there. A course designed for the former frequently fails the latter.",
    m8_wrapup: "The gain from casting the professor as a product manager is not an extra title but an extra set of questions that must be answered: who is my target audience, what are their pains, what value do I claim, does that value actually reach them, and what does it cost me. Fail to answer any one of these and course design reduces to tuning by instinct. In front of an AI-native cohort that risk is higher than it has ever been, because the instinct was formed on an audience that no longer exists.",

    /* ---------- M9 ---------- */
    m9_nav: "9. Fundamentals: ① × ② × ③",
    m9_title: "Fundamentals = Needs Acquisition × Knowledge Base and Spec × Vibe Coding",
    m9_overview: "The lower half of the third whiteboard page carries a formula: fundamentals equals step one times step two times step three. The three are acquiring needs, turning content into a knowledge base and a spec, and using vibe coding to drive it into artefacts. They are not new — they are the deepened form of the three operating elements from module 3 — but this time two things are added: what joins them is a multiplication sign rather than a plus sign, and the end of the line loops back to the beginning as a feedback loop.",
    m9_highlights: ["① × ② × ③", "Needs = Pains + Gains", "KB.md then Spec", "Graph-ification x Schema", "Feedback loop", "Any zero zeroes it all"],
    m9_p1: "Start with the multiplication sign. Under addition, doing two of the three well would still earn sixty per cent. The whiteboard writes multiplication: if any term is zero, the whole thing is zero. That notation upgrades the relationship from 'all three matter' to 'each is a precondition for the others'. Read the needs wrong and the most complete knowledge base in the world is solving a question nobody asked. Skip the knowledge base and vibe coding merely lets AI invent from thin air. Drop vibe coding and the first two stay in your head and never become anything.",
    m9_p2: "Three terms multiplied. If any one is zero, the whole is zero.",
    m9_p3: "Step one is needs acquisition, and the whiteboard splits Needs further into Pains and Gains: what students want to escape and what they want to gain. This is the step most often skipped, because teachers tend to feel they already know what students need. But module 8 has established that needs belong to the target audience, not to the designer's imagination. The Mentimeter Q2 exercise in module 7 is the worked demonstration of this step: one live question, thirteen responses, two-axis coding, and needs stop being a vague impression and become data that can be compared and accumulated.",
    m9_p4: "Step two turns content into something AI can use, and the whiteboard draws the full processing line: course design and classroom activity feed into KB.md, which is pushed on to a Spec, and finally into graph-ification and Schema. Every segment has a distinct job. KB.md is the master source and answers 'has the knowledge been retained'. The Spec answers 'what are we generating this time'. Graph-ification and Schema answer 'can AI find it' — the first wires concepts into a network of relations, the second describes fields and types. Module 6 noted that RAG quality depends on how structured the external data is; this segment is what that structuring concretely looks like.",
    m9_p5: "Step three, vibe coding, carries over from module 3 and needs no restatement: use natural language to drive the needs from step one and the knowledge base from step two into the four-stage deliverable chain of module 5. The genuinely new element is the fourth: the feedback loop. The whiteboard draws a line from the two sources feeding step two back round to step one, meaning that course design and classroom activity are not only material flowing downstream, they are demand signals flowing back upstream. Where students get stuck during an activity, what they ask, what they get wrong — that is the best available source for the next round of needs. Treat classroom activity as material collection only and you throw away half its value.",
    m9_p6: "Placed side by side with module 3, the progression across the three whiteboard pages becomes visible. Module 3's step one, Intention, becomes needs acquisition here; the difference is that the intention is no longer set by the teacher but obtained from the target audience. Module 3's step two, resource and repository, becomes KB.md plus Spec plus graph-ification; the difference is an upgrade from 'a pile of content' to 'a retrievable structure'. Step three, vibe coding, is identical on both sides. The feedback loop and the multiplication are absent from module 3 altogether: the first turns a linear process into a loop, the second turns three parallel items into three mutually dependent ones. Page three is not a fresh start; it pushes the same architecture from 'what the pieces are' to 'how to make them solid'.",
    m9_wrapup: "The word fundamentals is well chosen: it points not at more advanced technique but at the places that, done badly, leave nothing else standing. Multiplication means there is no shortcut — a fashionable toolchain cannot compensate for misreading the needs, and an immaculate knowledge base cannot compensate for never having asked students what they want. The feedback loop then guarantees that none of this is a one-off: every completed round generates fresh demand signals from classroom activity, so the next round's step one is sharper than the last. This is the teacher's version of the self-directed learning from module 2 — a course design process that gets better by running.",
    m9_terms: [{
      front: "Fundamentals = ① × ② × ③",
      back: "Needs acquisition times knowledge base and spec times vibe coding. The whiteboard uses multiplication, not addition: any zero zeroes the whole."
    }, {
      front: "Needs = Pains + Gains",
      back: "Needs split two ways: the pains students want to escape and the gains they want. Needs belong to the target audience, not the designer."
    }, {
      front: "KB.md (master source)",
      back: "The knowledge base gathering both course design and classroom activity. It answers whether the knowledge has been retained."
    }, {
      front: "Spec.",
      back: "An explicit description of what is being generated this time. It sits after KB.md and before the artefact."
    }, {
      front: "Graph-ification x Schema",
      back: "Restructuring the knowledge base: graph-ification wires concepts into relations, Schema describes fields and types. Together they answer whether AI can find it."
    }, {
      front: "Feedback loop",
      back: "Course design and classroom activity do not only flow downstream; they correct the needs upstream, turning a linear process into a self-improving loop."
    }, {
      front: "Dual role of classroom activity",
      back: "It is material flowing downstream and a demand signal flowing upstream. Collecting only the former throws away half its value."
    }, {
      front: "Multiplication vs. addition",
      back: "Addition says 'all three matter'; multiplication says 'each is a precondition'. The whiteboard chooses multiplication, so no term can compensate for another."
    }],
    m9_q: [{
